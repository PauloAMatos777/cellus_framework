[project]
name = "cellus-framework"
version = "2.0.0"
description = "Framework modular de Agente de IA com LangGraph + Tool Calling (Neo4j + MCP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.60",
    "langchain>=0.3.14",
    "langchain-openai>=0.2.14",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "neo4j>=5.27.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.25.0", "ruff>=0.9.0"]
sql = ["sqlalchemy>=2.0.0"]
postgres = ["sqlalchemy>=2.0.0", "psycopg2-binary>=2.9.0"]
mysql = ["sqlalchemy>=2.0.0", "mysql-connector-python>=9.0.0"]
databricks = ["sqlalchemy>=2.0.0", "databricks-sql-connector>=3.0.0"]
datasphere = ["sqlalchemy>=2.0.0", "hdbcli>=2.19.0"]
otel = ["opentelemetry-sdk>=1.20.0", "opentelemetry-exporter-otlp-proto-grpc>=1.20.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cellus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
